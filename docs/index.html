<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Finder</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio Finder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 104" fill="none">
      <ellipse cx="80" cy="52" rx="73" ry="46" stroke="currentColor" stroke-width="9"/>
      <path fill="currentColor" fill-rule="evenodd" d="M62 22H86A18 18 0 0 1 86 58H73V82H62ZM73 31V49H85A9 9 0 0 0 85 31Z"/>
    </svg>
    <h1>Studio Finder</h1>
  </div>
  <p id="dataLine" class="muted small"></p>
</header>

<main>
  <!-- SEARCH -->
  <section id="tab-search" class="tab active">
    <div class="group">
      <div class="group-head">
        <h2>Studios</h2>
        <button type="button" class="link" data-all="site">All</button>
        <button type="button" class="link" data-none="site">None</button>
      </div>
      <div id="sites" class="chips"></div>
    </div>

    <div class="group">
      <div class="group-head"><h2>Room types</h2></div>
      <div id="types" class="chips"></div>
    </div>

    <div class="group">
      <h2>Dates</h2>
      <div class="row">
        <label>From<input type="date" id="dateFrom"></label>
        <label>To<input type="date" id="dateTo"></label>
      </div>
      <p class="muted small">Up to 14 days. New dates, or adding a studio, pull fresh data from Pirate for the ticked studios (a few minutes). <button type="button" id="refreshBtn" class="link small">Refresh data for these dates</button></p>
    </div>

    <div class="group">
      <h2>Time of day</h2>
      <div class="row">
        <label>From<select id="timeFrom"></select></label>
        <label>To<select id="timeTo"></select></label>
      </div>
    </div>

    <div class="group">
      <h2>Minimum hours in a row</h2>
      <div id="minHours" class="seg"></div>
    </div>

    <p id="pullHint" class="hint" hidden></p>
    <button id="searchBtn" class="primary">Search</button>
    <div id="status" class="status" hidden></div>
  </section>

  <!-- RESULTS -->
  <section id="tab-results" class="tab">
    <div id="dayTabs" class="daytabs" role="tablist"></div>
    <p id="resultsSummary" class="muted small"></p>
    <div id="results"></div>
  </section>

</main>

<nav class="tabs">
  <button data-tab="search" class="active">Search</button>
  <button data-tab="results">Results <span id="count" class="badge" hidden></span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
